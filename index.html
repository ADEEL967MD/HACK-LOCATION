<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WHATSAPP HACK · 模拟控制台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e0a;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
    }

    .hack-dashboard {
      max-width: 780px;
      width: 100%;
      background: #0f130f;
      border: 2px solid #00ff66;
      border-radius: 18px;
      padding: 22px 20px 28px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.15), inset 0 0 20px rgba(255, 0, 85, 0.1);
      transition: 0.2s;
    }

    /* glitch header */
    .glitch-title {
      font-size: 26px;
      font-weight: 700;
      color: #ff0055;
      text-align: center;
      text-shadow: 0 0 12px #ff0055, 0 0 30px #ff0055;
      letter-spacing: 3px;
      animation: scratch-vibe 0.25s infinite alternate;
      word-break: break-word;
    }

    .sub-glow {
      color: #00ff66;
      text-align: center;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 18px;
      text-shadow: 0 0 8px #00ff66;
      opacity: 0.8;
    }

    @keyframes scratch-vibe {
      0% { transform: translate(0, 0); }
      50% { transform: translate(2px, -1px); }
      100% { transform: translate(-1px, 2px); }
    }

    .input-panel {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .cyber-input {
      flex: 2;
      min-width: 180px;
      padding: 14px 16px;
      background: #060b07;
      border: 1.5px solid #00ff66;
      color: #00ff66;
      font-size: 15px;
      border-radius: 40px;
      outline: none;
      box-shadow: inset 0 0 12px rgba(0, 255, 102, 0.2);
      font-family: inherit;
    }

    .cyber-input:focus {
      border-color: #ff0055;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4), inset 0 0 12px #ff0055;
    }

    .cyber-btn {
      flex: 1;
      min-width: 130px;
      padding: 14px 18px;
      background: #ff0055;
      border: none;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 1px;
      border-radius: 40px;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
      cursor: pointer;
      transition: 0.15s;
      font-family: inherit;
      text-transform: uppercase;
    }

    .cyber-btn:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 30px #00ff66;
    }

    /* 4 panels grid */
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 8px;
    }

    .hack-panel {
      background: #0a0f0a;
      border: 1px solid #1f3a1f;
      border-radius: 16px;
      padding: 16px 12px 14px;
      box-shadow: inset 0 0 20px rgba(0, 255, 102, 0.02);
      transition: 0.2s;
      backdrop-filter: blur(1px);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      text-transform: uppercase;
      color: #6f9f6f;
      letter-spacing: 1px;
      border-bottom: 1px dashed #1f3a1f;
      padding-bottom: 5px;
    }

    .panel-title .badge {
      background: #1f2a1f;
      padding: 0 10px;
      border-radius: 30px;
      color: #00ff66;
      font-size: 10px;
      border: 1px solid #00ff66;
    }

    .status-line {
      font-size: 13px;
      color: #b0ffb0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 24px;
    }

    .status-line .icon {
      font-size: 18px;
      line-height: 1;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: #1a2a1a;
      border-radius: 20px;
      margin: 4px 0 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #00ff66;
      border-radius: 20px;
      box-shadow: 0 0 12px #00ff66;
      transition: width 0.2s ease;
    }

    .progress-fill.red {
      background: #ff0055;
      box-shadow: 0 0 12px #ff0055;
    }

    .progress-fill.yellow {
      background: #ffcc00;
      box-shadow: 0 0 12px #ffcc00;
    }

    .timestamp {
      font-size: 10px;
      color: #4f7f4f;
      text-align: right;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .log-detail {
      font-size: 11px;
      color: #8fbf8f;
      word-break: break-word;
      line-height: 1.4;
    }

    .log-detail span {
      color: #ff0055;
    }

    /* responsive */
    @media (max-width: 560px) {
      .panel-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* small flicker */
    .flicker-text {
      animation: flicker 1.8s infinite;
    }

    @keyframes flicker {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* terminal style footer */
    .footer-stats {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #2f5f2f;
      border-top: 1px solid #1a2a1a;
      padding-top: 12px;
    }

    .footer-stats .live {
      color: #00ff66;
      animation: pulse-dot 1.2s infinite;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
  </style>
</head>
<body>

<div class="hack-dashboard" id="app">
  <div class="glitch-title">📱 WHATSAPP HACK</div>
  <div class="sub-glow">⧩  SYSTEM  •  DIAGNOSTIC  •  TARGET  ⧩</div>

  <div class="input-panel">
    <input type="text" id="targetPhone" class="cyber-input" placeholder="+92 3XX 1234567" value="+92 300 1234567" />
    <button class="cyber-btn" id="attackBtn">⟳  EXECUTE</button>
  </div>

  <!-- 4 PANELS -->
  <div class="panel-grid" id="panelContainer">
    <!-- panel 1: SLOW / CRASH -->
    <div class="hack-panel" data-panel="0">
      <div class="panel-title"><span>🔻 SPEED ATTACK</span><span class="badge">SLOW</span></div>
      <div class="status-line"><span class="icon">🐢</span> <span id="p0status">等待触发...</span></div>
      <div class="progress-container"><div class="progress-fill" id="p0progress"></div></div>
      <div class="log-detail" id="p0detail">⏳ 就绪</div>
      <div class="timestamp" id="p0time">--:--:--</div>
    </div>

    <!-- panel 2: CRASH / DATA LOSS -->
    <div class="hack-panel" data-panel="1">
      <div class="panel-title"><span>💥 CRASH ENGINE</span><span class="badge">KILL</span></div>
      <div class="status-line"><span class="icon">🧨</span> <span id="p1status">等待触发...</span></div>
      <div class="progress-container"><div class="progress-fill red" id="p1progress"></div></div>
      <div class="log-detail" id="p1detail">⚡ 就绪</div>
      <div class="timestamp" id="p1time">--:--:--</div>
    </div>

    <!-- panel 3: DELETE / WIPE -->
    <div class="hack-panel" data-panel="2">
      <div class="panel-title"><span>🗑️ DATA WIPE</span><span class="badge">DELETE</span></div>
      <div class="status-line"><span class="icon">⚠️</span> <span id="p2status">等待触发...</span></div>
      <div class="progress-container"><div class="progress-fill yellow" id="p2progress"></div></div>
      <div class="log-detail" id="p2detail">🧹 就绪</div>
      <div class="timestamp" id="p2time">--:--:--</div>
    </div>

    <!-- panel 4: RECOVERY / STATUS -->
    <div class="hack-panel" data-panel="3">
      <div class="panel-title"><span>📊 RECOVERY</span><span class="badge">STATUS</span></div>
      <div class="status-line"><span class="icon">🔄</span> <span id="p3status">等待触发...</span></div>
      <div class="progress-container"><div class="progress-fill" id="p3progress"></div></div>
      <div class="log-detail" id="p3detail">📡 就绪</div>
      <div class="timestamp" id="p3time">--:--:--</div>
    </div>
  </div>

  <!-- footer -->
  <div class="footer-stats">
    <span class="live">● LIVE</span>
    <span id="globalTime">PKT 00:00:00</span>
    <span>🔒 模拟 · v2.0</span>
  </div>
</div>

<script>
  (function() {
    // ----- DOM refs -----
    const phoneInput = document.getElementById('targetPhone');
    const attackBtn = document.getElementById('attackBtn');

    // panels
    const panelStatus = [
      document.getElementById('p0status'),
      document.getElementById('p1status'),
      document.getElementById('p2status'),
      document.getElementById('p3status')
    ];
    const panelProgress = [
      document.getElementById('p0progress'),
      document.getElementById('p1progress'),
      document.getElementById('p2progress'),
      document.getElementById('p3progress')
    ];
    const panelDetail = [
      document.getElementById('p0detail'),
      document.getElementById('p1detail'),
      document.getElementById('p2detail'),
      document.getElementById('p3detail')
    ];
    const panelTime = [
      document.getElementById('p0time'),
      document.getElementById('p1time'),
      document.getElementById('p2time'),
      document.getElementById('p3time')
    ];

    const globalTimeEl = document.getElementById('globalTime');

    // ------ helpers ------
    function getPakistanTime() {
      const now = new Date();
      const pktOffset = 5 * 60 * 60 * 1000; // PKT UTC+5
      const localOffset = now.getTimezoneOffset() * 60 * 1000;
      const pktTime = new Date(now.getTime() + localOffset + pktOffset);
      return pktTime;
    }

    function formatTime(date) {
      return date.toTimeString().split(' ')[0]; // HH:MM:SS
    }

    function updateClock() {
      const pkt = getPakistanTime();
      globalTimeEl.textContent = `PKT ${formatTime(pkt)}`;
      // update each panel timestamp (show current PKT)
      const nowStr = formatTime(pkt);
      for (let i = 0; i < 4; i++) {
        if (panelTime[i]) panelTime[i].textContent = nowStr;
      }
    }

    // update clock every second
    setInterval(updateClock, 1000);
    updateClock();

    // ------ panel simulation ------
    let running = false;
    let intervalIds = [];

    function stopAllIntervals() {
      intervalIds.forEach(id => clearInterval(id));
      intervalIds = [];
    }

    function resetPanels() {
      stopAllIntervals();
      for (let i = 0; i < 4; i++) {
        panelStatus[i].textContent = '⏳ 就绪';
        panelProgress[i].style.width = '0%';
        panelDetail[i].innerHTML = '⚡ 等待触发...';
        // keep time
      }
      running = false;
    }

    // start hack simulation
    function startHack(target) {
      if (running) {
        resetPanels();
        // small delay then restart
        setTimeout(() => startHack(target), 150);
        return;
      }

      // reset all panels first
      for (let i = 0; i < 4; i++) {
        panelStatus[i].textContent = '⏳ 启动中...';
        panelProgress[i].style.width = '0%';
        panelDetail[i].innerHTML = '⏳ 初始化...';
      }

      running = true;
      const phone = target || '+92 300 1234567';

      // ---------- PANEL 0 : SLOW / CRASH (WhatsApp slowing) ----------
      let p0 = 0;
      const p0interval = setInterval(() => {
        if (!running) { clearInterval(p0interval); return; }
        p0 += 1 + Math.floor(Math.random() * 4);
        if (p0 > 100) p0 = 100;
        panelProgress[0].style.width = p0 + '%';
        panelStatus[0].textContent = '🐢 减速中...';
        if (p0 < 40) {
          panelDetail[0].innerHTML = `📉 WhatsApp 响应延迟 <span>${p0}ms</span>`;
        } else if (p0 < 75) {
          panelDetail[0].innerHTML = `⚠️ 严重延迟 · 丢包 <span>${p0}%</span>`;
        } else {
          panelDetail[0].innerHTML = `💀 连接超时 · 接近崩溃 <span>${p0}%</span>`;
        }
        if (p0 >= 100) {
          panelStatus[0].textContent = '💀 CRASHED';
          panelDetail[0].innerHTML = '❌ WhatsApp 已停止响应 · 强制关闭';
          panelProgress[0].style.width = '100%';
          clearInterval(p0interval);
        }
      }, 280);

      // ---------- PANEL 1 : CRASH / DATA CORRUPT ----------
      let p1 = 0;
      const p1interval = setInterval(() => {
        if (!running) { clearInterval(p1interval); return; }
        p1 += 2 + Math.floor(Math.random() * 5);
        if (p1 > 100) p1 = 100;
        panelProgress[1].style.width = p1 + '%';
        panelStatus[1].textContent = '🧨 崩溃注入';
        if (p1 < 50) {
          panelDetail[1].innerHTML = `💢 数据库损坏 <span>${p1}%</span>`;
        } else if (p1 < 85) {
          panelDetail[1].innerHTML = `🔥 关键表丢失 · 强制终止 <span>${p1}%</span>`;
        } else {
          panelDetail[1].innerHTML = `☠️ 全部数据已损坏 · 不可恢复`;
        }
        if (p1 >= 100) {
          panelStatus[1].textContent = '💥 KILLED';
          panelDetail[1].innerHTML = '🧨 应用崩溃 · 进程已终止';
          panelProgress[1].style.width = '100%';
          clearInterval(p1interval);
        }
      }, 350);

      // ---------- PANEL 2 : DELETE / WIPE ----------
      let p2 = 0;
      const p2interval = setInterval(() => {
        if (!running) { clearInterval(p2interval); return; }
        p2 += 2 + Math.floor(Math.random() * 4);
        if (p2 > 100) p2 = 100;
        panelProgress[2].style.width = p2 + '%';
        panelStatus[2].textContent = '🗑️ 擦除中';
        if (p2 < 45) {
          panelDetail[2].innerHTML = `🧹 删除聊天记录 <span>${p2}%</span>`;
        } else if (p2 < 80) {
          panelDetail[2].innerHTML = `⚠️ 媒体文件清除 <span>${p2}%</span>`;
        } else {
          panelDetail[2].innerHTML = `💾 所有数据已抹除 · 不可恢复`;
        }
        if (p2 >= 100) {
          panelStatus[2].textContent = '🗑️ DELETED';
          panelDetail[2].innerHTML = '✅ 账号数据已完全清除';
          panelProgress[2].style.width = '100%';
          clearInterval(p2interval);
        }
      }, 400);

      // ---------- PANEL 3 : RECOVERY / STATUS (fake recovery & speed) ----------
      let p3 = 0;
      let phase = 0; // 0: slow, 1: recovery, 2: hacked
      const p3interval = setInterval(() => {
        if (!running) { clearInterval(p3interval); return; }

        if (phase === 0) {
          p3 += 1 + Math.floor(Math.random() * 3);
          if (p3 > 40) { phase = 1; p3 = 40; }
          panelProgress[3].style.width = p3 + '%';
          panelStatus[3].textContent = '📉 性能下降';
          panelDetail[3].innerHTML = `🐌 响应延迟 <span>${p3 * 2}ms</span> · 缓慢`;
        } else if (phase === 1) {
          p3 += 2 + Math.floor(Math.random() * 4);
          if (p3 > 80) { phase = 2; p3 = 80; }
          panelProgress[3].style.width = p3 + '%';
          panelStatus[3].textContent = '🔄 恢复中...';
          panelDetail[3].innerHTML = `⚡ 修复尝试 <span>${p3}%</span> · 部分恢复`;
        } else if (phase === 2) {
          p3 += 1 + Math.floor(Math.random() * 2);
          if (p3 > 100) p3 = 100;
          panelProgress[3].style.width = p3 + '%';
          panelStatus[3].textContent = '☠️ HACKED';
          panelDetail[3].innerHTML = `🔴 目标已被完全控制 · 状态: <span>COMPROMISED</span>`;
          if (p3 >= 100) {
            panelStatus[3].textContent = '💀 HACKED · 完成';
            panelDetail[3].innerHTML = '✅ 系统接管成功 · 所有数据可访问';
            panelProgress[3].style.width = '100%';
            clearInterval(p3interval);
          }
        }
      }, 380);

      // store intervals for cleanup
      intervalIds = [p0interval, p1interval, p2interval, p3interval];

      // update timestamp on each panel with current PKT (ongoing)
      const timeUpdater = setInterval(() => {
        const pkt = getPakistanTime();
        const ts = formatTime(pkt);
        for (let i = 0; i < 4; i++) {
          panelTime[i].textContent = ts;
        }
      }, 1000);
      intervalIds.push(timeUpdater);

      // stop all after 30 seconds (reset)
      setTimeout(() => {
        if (running) {
          // keep panels as they are but we allow manual reset by pressing again
          // we don't auto reset to keep hacked state visible
        }
      }, 35000);
    }

    // ------ event binding ------
    attackBtn.addEventListener('click', function() {
      const phone = phoneInput.value.trim() || '+92 300 1234567';
      // if already running, stop and restart
      if (running) {
        resetPanels();
        // start fresh after small delay
        setTimeout(() => startHack(phone), 200);
      } else {
        startHack(phone);
      }
    });

    // Enter key on input
    phoneInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        attackBtn.click();
      }
    });

    // initial auto-start with demo number (so it looks alive)
    window.addEventListener('load', function() {
      // start with default phone after 800ms
      setTimeout(() => {
        startHack('+92 300 1234567');
      }, 500);
    });

    // clean intervals on page unload (optional)
    window.addEventListener('beforeunload', function() {
      stopAllIntervals();
    });

  })();
</script>

</body>
</html>
